{% set name = "py-markdown-table" %}
{% set version = "2.0.0" %}
{% set python_min = "3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/py_markdown_table-{{ version }}.tar.gz
  sha256: 1a787bcfb67cbf07b76ce3b5a3f6e776e378dccf2377c019d55b9309573b861b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<4

test:
  imports:
    - py_markdown_table
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hvalev/py-markdown-table
  summary: Package that generates markdown tables from a list of dicts
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hvalev
    - dlqqq
    - keerthi-swarna
